name: WiFi rooms sync check

# Weekly guard: keeps the bundled ETECSA navigation-rooms directory (Ajustes ›
# Salas y Zonas WiFi) in sync with ETECSA's own site. ETECSA may not be
# reachable from wherever this runs (GitHub-hosted runners are outside Cuba,
# and some sites block cloud/datacenter IP ranges even though they're open to
# regular visitors) — the script checks reachability ONCE up front and exits
# early (no failure, no issue) instead of burning Actions minutes retrying all
# 16 province pages one by one when it can't reach ETECSA at all.

on:
  workflow_dispatch:
  # pull_request:
  #   paths:
  #     - "Qvacell/wifi_navigation_rooms.json"
  #     - ".github/scripts/check-wifi-rooms-sync.mjs"
  #     - ".github/workflows/wifi-rooms-sync-check.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: wifi-rooms-sync-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      REPORT_FILE: wifi-rooms-sync-report.md
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compare bundled rooms against ETECSA's site
        id: check
        continue-on-error: true
        # `continue-on-error` only exposes outcome (success/failure), not the exit code — but
        # exit 2 (unreachable) and exit 1 (real drift) need different handling below, so capture
        # it explicitly as a step output. `set +e` around the call: bash's default `set -e` would
        # otherwise abort the script on a non-zero exit before `$?` could be read.
        run: |
          set +e
          node .github/scripts/check-wifi-rooms-sync.mjs
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Report unreachable (not a failure — just can't verify from here)
        if: steps.check.outcome == 'failure' && steps.check.outputs.exit_code == '2'
        run: echo "::notice::ETECSA unreachable from this runner — skipped province checks, nothing to report."

      - name: Open or update drift issue
        if: steps.check.outcome == 'failure' && steps.check.outputs.exit_code != '2' && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.REPORT_FILE, 'utf8');
            const title = 'WiFi navigation rooms drifted from ETECSA\'s site';
            const marker = '<!-- wifi-rooms-sync-check -->';
            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'wifi-rooms-sync', per_page: 100,
            });
            const found = open.find((i) => i.title === title);
            const fullBody = `${marker}\n\n${body}`;
            if (found) {
              await github.rest.issues.update({ owner, repo, issue_number: found.number, body: fullBody });
            } else {
              await github.rest.issues.create({ owner, repo, title, body: fullBody, labels: ['wifi-rooms-sync'] });
            }

      - name: Fail if real drift was found (not just unreachable)
        if: steps.check.outcome == 'failure' && steps.check.outputs.exit_code != '2'
        run: |
          echo "WiFi navigation rooms are out of sync with ETECSA's site."
          exit 1
