name: Qvacell
options:
  bundleIdPrefix: com.qvacell
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Qvacell:
    type: application
    platform: iOS
    sources:
      - Qvacell
      - Shared
    info:
      path: Qvacell/Info.plist
      properties:
        CFBundleDisplayName: Qvacell
        CFBundleShortVersionString: 1.2.4
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSApplicationQueriesSchemes:
          - tel
          - telprompt
        NSContactsUsageDescription: Para mostrar tus contactos y llamarlos directamente desde la app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qvacell.app
        MARKETING_VERSION: 1.2.4
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    entitlements:
      path: Qvacell/Qvacell.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.qvacell.shared
    dependencies:
      - target: CallerIDExtension
        embed: true
    scheme:
      testTargets: []

  CallerIDExtension:
    type: app-extension
    platform: iOS
    sources:
      - CallerIDExtension
      - Shared
    info:
      path: CallerIDExtension/Info.plist
      properties:
        CFBundleDisplayName: CallerID
        CFBundleShortVersionString: 1.2.4
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.callkit.call-directory
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CallDirectoryHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qvacell.app.CallerIDExtension
        MARKETING_VERSION: 1.2.4
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: NO
    entitlements:
      path: CallerIDExtension/CallerIDExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.qvacell.shared
