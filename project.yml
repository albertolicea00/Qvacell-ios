name: Qvacell
options:
  bundleIdPrefix: com.qvacell
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Qvacell:
    type: application
    platform: iOS
    sources:
      - Qvacell
      - path: Qvacell.xcassets
    info:
      path: Qvacell/Info.plist
      properties:
        CFBundleDisplayName: Qvacell
        CFBundleShortVersionString: 1.2.4
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSApplicationQueriesSchemes:
          - tel
          - telprompt
        NSContactsUsageDescription: Para mostrar tus contactos y llamarlos directamente desde la app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qvacell.app
        MARKETING_VERSION: 1.2.4
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: []
